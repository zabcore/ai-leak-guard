<!doctype html>
<meta charset="utf-8" />
<title>ChatGPT</title>
<!--
  §C monitor fixture — a faithful, minimal reproduction of ChatGPT's live
  composer DOM (the shape the shipped adapters key on), plus data-monitor
  hooks the harness drives. Served (dry-run) at https://chatgpt.com/* via
  request interception, so the packaged content script injects exactly as
  it would on the real site.

  Shipped contract (src/content/adapters/chatgpt.ts + submit/adapters/chatgpt.ts):
    composer     #prompt-textarea / [contenteditable][role=textbox]
    send button  button[data-testid="send-button"]
-->
<main>
  <div
    id="prompt-textarea"
    contenteditable="true"
    role="textbox"
    data-testid="prompt-textarea"
    data-monitor="composer"
  ></div>
  <button data-testid="send-button" aria-label="Send prompt" data-monitor="send">Send</button>
  <input type="file" data-monitor="file" />
</main>
