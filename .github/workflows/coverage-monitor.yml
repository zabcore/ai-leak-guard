name: Coverage Monitor (Gate C)

# V1.3.1 §C — the compatibility monitor, promoted from scaffold to a real
# always-on monitor.
#
# TWO modes run here:
#   • DRY-RUN     — a synthetic fixture served at each surface's real origin.
#                   Catches OUR regressions (an adapter change breaking a
#                   route). Needs no network, no credentials. It does NOT
#                   catch the site drifting under us, because the fixture is
#                   frozen.
#   • LIVE-NOAUTH — navigates the REAL logged-out origin (chatgpt.com,
#                   perplexity.ai, and the pre-hydration composer states) and
#                   asserts the packaged extension still recognises the
#                   composer and mounts its modal host. This is the drift
#                   detector — the states that actually leaked to users.
#                   Needs no credentials. CAPTCHA / IP block / outage must
#                   surface as a FAILED (never-green) run, classified in the
#                   report as ENVIRONMENT/AUTH, distinct from PRODUCT FAILURE.
#
# Authenticated (logged-in) states are added later via MONITOR_MODE=live +
# a storageState secret, once test accounts exist.

on:
  workflow_dispatch:
    inputs:
      induce_failure:
        description: 'Deliberately fail one probe, to test that alerting fires'
        type: boolean
        default: false
      release_candidate:
        description: 'Gate on recorded live evidence (fails unless required routes are green)'
        type: boolean
        default: false
  schedule:
    # Daily 06:00 UTC. A missed/late cron run is caught by the dead-man's
    # switch below, so a silent non-run cannot read as green.
    - cron: '0 6 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'monitor/**'
      - 'src/content/adapters/**'
      - 'src/content/submit/**'
      - 'src/shared/coverage.ts'
      - '.github/workflows/coverage-monitor.yml'

permissions:
  contents: read

jobs:
  monitor-dry:
    name: Dry-run coverage monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck:monitor
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run the coverage monitor (dry-run)
        run: npm run monitor
        env:
          CI: 'true'
          MONITOR_MODE: dry
          MONITOR_INDUCE_FAILURE: ${{ inputs.induce_failure && '1' || '' }}
      - name: Upload dry-run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-monitor-dry-report
          path: monitor/playwright-report/
          retention-days: 14

  monitor-live-noauth:
    name: Live no-auth drift monitor (non-blocking)
    runs-on: ubuntu-latest
    # NON-BLOCKING: these public sites bot-mitigate automated/datacenter
    # clients, so a live run may legitimately return UNCLASSIFIED/ENV without
    # any product regression. It records per-route status + uploads an artifact
    # as a best-effort drift signal, but a third-party bot policy must never
    # red-gate the release. The required gate is `monitor-dry`.
    continue-on-error: true
    # Only on the schedule / manual run — a live hit on every PR is wasteful
    # and flaky. PRs are covered by the dry-run job above.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck:monitor
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # Restore the CI-scoped store from the most recent prior CI run so the
      # 36 h expiry / streak span runs. This store is CI-ONLY (key + filename):
      # it is never read by the release-gate, so a bot-blocked CI live run can
      # neither satisfy nor fail the gate on recorded real-environment evidence.
      - name: Restore CI live status
        uses: actions/cache/restore@v4
        with:
          path: monitor/status
          key: ci-live-status-${{ github.run_id }}
          restore-keys: |
            ci-live-status-
      - name: Run the coverage monitor (live, no credentials)
        run: npm run monitor
        env:
          CI: 'true'
          MONITOR_MODE: live-noauth
          # CI-scoped store — deliberately NOT the release-gate's store.
          MONITOR_STATUS_PATH: monitor/status/ci-live-status.json
      - name: Save CI live status
        # Persist even on failure — a red/blocked run must still record that the
        # route did NOT pass (so it reads stale/blocked next time, never green).
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: monitor/status
          key: ci-live-status-${{ github.run_id }}
      - name: Upload CI live status artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-monitor-live-status
          path: monitor/status/
          retention-days: 30
      - name: Upload live report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-monitor-live-report
          path: monitor/playwright-report/
          retention-days: 14

  # Release-candidate gate: dispatch with release_candidate=true. It reads the
  # REAL-ENVIRONMENT live store (cache namespace `real-live-status-*`) and FAILS
  # unless every required route is green — last result PASS, within 36 h, ≥ 2
  # consecutive passes.
  #
  # It is deliberately DECOUPLED from `monitor-live-noauth` (no `needs`) and
  # reads a DIFFERENT cache namespace, so a bot-blocked CI live run can neither
  # satisfy nor fail it. The `real-live-status-*` cache is populated out-of-band
  # from a REAL machine (see README "Operating Gate C"); the authoritative live
  # proof is the guided self-test run by a person in a real browser. With no
  # real evidence recorded, this gate fails closed (correct — not release-ready).
  release-gate:
    name: Release-candidate gate (real-environment live evidence)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Restore REAL-environment live status (never written by CI live)
        uses: actions/cache/restore@v4
        with:
          path: monitor/status
          key: real-live-status-${{ github.run_id }}
          restore-keys: |
            real-live-status-
      - name: Verify required live routes are green (real-environment evidence)
        run: npm run verify:live-status

  # Dead-man's switch: tied to the DRY path only, so alerting never depends on
  # live-site reachability. Pings the healthcheck ONLY when the required dry job
  # succeeded on the schedule. If a scheduled run is skipped/delayed or the dry
  # job fails, no ping is sent and the external healthcheck service alerts the
  # owner — GitHub sends no email when a scheduled run simply never happens.
  heartbeat:
    name: Signal healthy run
    runs-on: ubuntu-latest
    needs: [monitor-dry]
    if: ${{ github.event_name == 'schedule' && success() }}
    steps:
      - name: Ping dead-man's switch
        run: |
          if [ -z "${HC_URL}" ]; then
            echo "HEALTHCHECK_URL secret not set — skipping ping. Set it to arm the dead-man's switch."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "${HC_URL}" && echo "pinged healthcheck"
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
